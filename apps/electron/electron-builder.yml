# electron-builder configuration for the dsh desktop shell (M3 packaging).
# Targets: NSIS (Windows), DMG (macOS), AppImage + deb (Linux).

appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness
# The scoped package name would otherwise mangle into the executable name
# (`@deepseek-aidsh-desktop`); pin the binary name explicitly.
executableName: dsh-desktop

directories:
  output: dist
  buildResources: resources

# Use the locally installed Electron dist instead of downloading the zip:
# the environment may not reach the release CDN (see the M3 note), and the
# dist directory is equivalent for unpacked and installer builds.
electronDist: node_modules/electron/dist

files:
  - lib/**/*
  - config/**/*
  - resources/**/*
  # The built web frontend ships as a dependency of this app; electron-builder
  # collects node_modules, and the frontend package's `files` already limits
  # the published payload to `dist`.
  - node_modules/**/*

# The desktop boot's profile fallback (`healProfilesModuleFallback`) junctions
# `$DSH_HOME/profiles/node_modules` at the app's shipped packages, and a
# junction must name an on-disk directory — so every node_modules package is
# unpacked from the asar archive (app-boot's resolver rewrites `app.asar` to
# `app.asar.unpacked` for that). Keeping asar on still archives the shell code
# (lib, config); the packages themselves ship unpacked.
asar: true

asarUnpack:
  # All of node_modules: the boot closure may junction any package, and
  # unpacked plugins must resolve their transitive dependencies from disk.
  - '**/node_modules/**'

# The desktop composition loads no native module at runtime: node-pty's .node
# is lazy (only interactive terminals touch it, and this composition omits the
# terminal row), koffi's Win32 dialog path is superseded by the Electron dialog
# backend, and the Loader's bare-specifier helper is replaced by the shell's
# own internal-loader fallback. Rebuilding them for Electron's ABI would demand
# a Visual Studio C++ toolchain on the build machine for binaries the app never
# runs — the unpacked development run uses these exact installed artifacts, so
# skip the rebuild.
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  # Per-file install progress (ShowInstDetails + SetDetailsPrint) so the
  # installer visibly copies/removes files instead of painting one bar.
  include: build/installer.nsh

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}

# The tray and window icons (M2 chrome references resources/tray.png).
icon: resources/icon.png
